- id: bisio2026size
  section: published
  title: Firm Size and the Automation Wage Premium
  coauthors: [bisio, grazzi, moschella]
  venue: Small Business Economics
  details: online first
  year: 2026
  url: https://doi.org/10.1007/s11187-026-01227-2
  links:
    - label: pdf (open access)
      url: https://link.springer.com/content/pdf/10.1007/s11187-026-01227-2.pdf
    - label: doi
      url: https://doi.org/10.1007/s11187-026-01227-2
  abstract: |-
    We investigate the impact of investment in automation-related goods on wages and wage inequality across firms of different sizes in Italy from 2011 to 2019. We integrate datasets on trade activities, firm, and worker characteristics for the population of Italian importing firms and quantify the automation wage premium for adopting firms, which stands at approximately 10%. However, Mincer-type wage regressions reveal that automation adopters pay approximately 3% higher wages after controlling for worker sorting. We then disentangle the impact of automation adoption on wages from selection into adoption by estimating the effects on adopters’ wages and wage dispersion within a difference-in-differences framework, exploiting import lumpiness in product categories linked to automation technologies (including robots). We find a positive average adoption effect on adopters’ average wages, which stabilizes at around 4% 5 years after an automation spike. Wage increases at small firms primarily explain this effect, while wages at medium and large firms remain stagnant after adoption. Importantly, wage gains coincide with an increase in within-firm wage dispersion in small firms, with wage variance rising by around 7.5%. This result comprises heterogeneous effects not only across firms but also across worker groups: decomposition analysis reveals that wage benefits are concentrated among specific worker categories—employees aged 45 and above, managers, and white-collar workers. Other worker categories experience stagnant wages, although no group shows a negative wage effect.

- id: bisio2025automation
  section: published
  title: "The Dynamics of Automation Adoption: Firm-Level Heterogeneity and Aggregate Employment Effects"
  coauthors: [bisio, grazzi, moschella]
  venue: European Economic Review
  details: "173, 104943"
  year: 2025
  url: https://doi.org/10.1016/j.euroecorev.2024.104943
  links:
    - label: doi
      url: https://doi.org/10.1016/j.euroecorev.2024.104943
    - label: working paper version
      url: https://www.lem.sssup.it/WPLem/2023-37.html
  abstract: |-
    We investigate the impact of investment in automation-related goods on adopting and non-adopting firms in the Italian economy during 2011–2019. We integrate datasets on trade activities, firms’, and workers’ characteristics for the population of Italian importing firms and estimate the effects on adopters’ outcomes within a difference-in-differences design exploiting import lumpiness in product categories linked to automation technologies (including robots). We find a positive average adoption effect on the adopters’ employment: firms are, on average, around 3% larger in terms of employment after an automation spike. Crucially, the employment effect is heterogeneous across firms: a positive effect is predominant among small firms, which are around 5% larger five years after the spike; on the contrary, a negative displacement effect is predominant among medium and large firms, with an employment contraction at five years of around −4%. This result can shed light on one potential reason behind the mixed results found in previous studies, which often rely on samples with different size distributions. We complete the framework with a 5-digit sector-level analysis showing that adopting automation technologies has an overall weak negative effect on aggregate employment, and with an analysis of the competition effects of automation, showing that non-adopters suffer a loss in sales and employment.

- id: barigozzi2025factoring
  section: published
  title: "Factoring in the Micro: A Transaction-Level Dynamic Factor Approach to the Decomposition of Export Volatility"
  coauthors: [barigozzi, grazzi, moschella]
  venue: Oxford Bulletin of Economics and Statistics
  details: "87(1), 155–184"
  year: 2025
  url: https://doi.org/10.1111/obes.12639
  links:
    - label: doi
      url: https://doi.org/10.1111/obes.12639
    - label: working paper version
      url: https://www.lem.sssup.it/WPLem/2021-22.html
    - label: replication code
      url: https://drive.google.com/file/d/18OV_XHLYx0v3xcTqD7NhNCedqNSccsnk/view?usp=drive_link
  abstract: |-
    This paper analyzes the export volatility sources estimating a dynamic factor model on transaction-level data. Utilizing an exhaustive dataset of French export transactions from 1993 to 2017, we reconstruct the latent factors space associated with global and destination-specific macroeconomic shocks through a Quasi-Maximum likelihood approach which allows accommodating both the high share of missing values and the high dimensionality of the microeconomic time series. The estimated parameters are then used to derive a volatility decomposition of the aggregate and firm-level export growth rates, highlighting structural spatial patterns and the role of geographical diversification in mitigating export risks.

