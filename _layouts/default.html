<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    /* When shown inside another page (the old Google Site embeds it): light theme, links open in the full window. */
    if (window.self !== window.top) {
      document.documentElement.setAttribute('data-embedded', '');
      var b = document.createElement('base'); b.target = '_top'; document.head.appendChild(b);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% seo %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      <ul>
        {%- for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      · <a href="{{ site.links.scholar }}">Google Scholar</a>
      · <a href="{{ site.links.orcid }}">ORCID</a>
    </p>
  </footer>
</body>
</html>
